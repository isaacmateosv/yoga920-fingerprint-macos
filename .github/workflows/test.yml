name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (prebuilt wheels only)
        run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - name: Daemon / matcher tests (synthetic data, fake sensor)
        run: python -I tests/test_daemon.py
      - name: Build PAM module
        run: make -C pam
      - name: Build menu bar app
        run: bash app/build.sh
      - name: Build authorization plugin
        run: make -C authplugin
      - name: Lint installer
        run: bash -n install.sh
